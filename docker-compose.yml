# ==============================================================================
# Docker Compose: Cấu hình Container Orchestration cho Hệ thống WebAtlas GIS
# Các dịch vụ bao gồm:
# - web: Nginx Frontend Web Application (React Vite Single Page App)
# - mapserver: MapServer OGC WMS/WFS Map Engine CGI
# - postgis: Cơ sở dữ liệu Không gian PostgreSQL/PostGIS
# ==============================================================================

services:
  # Dịch vụ Frontend UI Nginx Web Server
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    depends_on:
      - mapserver
    networks:
      - webatlas_net

  # Dịch vụ Máy chủ Bản đồ MapServer OGC WMS/WFS CGI Engine
  mapserver:
    build:
      context: ./mapserver
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    volumes:
      - ./mapserver/config:/etc/mapserver
      - ./processed:/data/processed:ro
    environment:
      - MS_MAPFILE=/etc/mapserver/atlas.map
      - MS_DEBUGLEVEL=3
    restart: always
    depends_on:
      - postgis
    networks:
      - webatlas_net

  # Dịch vụ Cơ sở dữ liệu Không gian PostGIS PostgreSQL
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: always
    networks:
      - webatlas_net

# Mạng kết nối nội bộ giữa các container Docker
networks:
  webatlas_net:
    driver: bridge

# Khối lưu trữ dữ liệu bền vững cho cơ sở dữ liệu PostGIS
volumes:
  postgis_data:
