# ==============================================================================
# Nginx Configuration: Reverse Proxy & Cấu hình Nginx Web Server cho WebAtlas
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Bộ phân giải DNS nội bộ của Docker cho các tên Container
    resolver 127.0.0.11 valid=30s;

    root /usr/share/nginx/html;
    index index.html;

    # Nén Gzip nâng cao tốc độ tải mảnh bản đồ & dữ liệu GIS
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/vnd.ogc.gml;

    # Cấu hình SPA Fallback cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy chuyển tiếp các yêu cầu WMS/WFS tới container MapServer
    location /mapserver/ {
        proxy_pass http://mapserver:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bộ đệm Cache cho tệp tài nguyên tĩnh (Static assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
